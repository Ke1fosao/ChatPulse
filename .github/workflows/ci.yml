name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload architecture source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: architecture-source-snapshot
          path: |
            .
            !.git
            !miniapp/node_modules
            !miniapp/dist
            !miniapp/playwright-report
            !miniapp/test-results

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        shell: bash
        run: |
          set +e
          npm test -- --run > ../frontend-test.log 2>&1
          status=$?
          tail -n 200 ../frontend-test.log
          exit $status
      - name: Upload frontend test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: frontend-test.log
      - run: npm run typecheck
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - name: Run WebKit mobile checks
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            miniapp/playwright-report
            miniapp/test-results
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -e ".[dev]" -c requirements.lock
      - name: Run backend lint
        shell: bash
        run: |
          set +e
          ruff check . > backend-lint.log 2>&1
          status=$?
          cat backend-lint.log
          exit $status
      - name: Upload backend lint log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-log
          path: backend-lint.log
      - name: Check backend formatting
        shell: bash
        run: |
          set +e
          ruff format --check --diff . > backend-format.log 2>&1
          status=$?
          cat backend-format.log
          exit $status
      - name: Upload backend formatting diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-format-log
          path: backend-format.log
      - name: Run backend tests
        shell: bash
        run: |
          set +e
          pytest -q > backend-test.log 2>&1
          status=$?
          tail -n 300 backend-test.log
          exit $status
      - name: Upload backend test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend-test.log
      - run: python -m compileall app migrations

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, browser, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        shell: bash
        run: |
          set +e
          docker build -t chatpulse-miniapp:test . > docker-build.log 2>&1
          status=$?
          tail -n 240 docker-build.log
          exit $status
      - name: Upload Docker build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: docker-build.log
