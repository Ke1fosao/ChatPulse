name: CI

on:
  push:
    branches:
      - production/chatpulse-3-0
  pull_request:

permissions:
  contents: write

jobs:
  apply-production:
    if: github.actor != 'github-actions[bot]' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/chatpulse-3-0
          fetch-depth: 0
      - name: Verify and apply Production 3.0 package
        run: python tools/apply_production.py
      - name: Commit clean implementation
        run: |
          set -euo pipefail
          git config user.name "ChatPulse Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "production: implement ChatPulse 3.0 hardening"
          git push origin HEAD:production/chatpulse-3-0
