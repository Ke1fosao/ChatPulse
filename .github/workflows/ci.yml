name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-architecture:
    if: github.actor != 'github-actions[bot]' && ((github.event_name == 'push' && github.ref == 'refs/heads/architecture/chatpulse-2-0') || (github.event_name == 'pull_request' && github.head_ref == 'architecture/chatpulse-2-0'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/chatpulse-2-0
          fetch-depth: 0
      - name: Verify, decode and apply architecture package
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "Invalid architecture chunk: $path expected=$expected actual=$actual"
              exit 1
            fi
          done <<'EOF'
          3e00028547cdbb5ef4613e9ce7b3478f1d7c1be6 tools/architecture-batch.part00
          27e7d18c577d989406b9660361ae88db0261f9d1 tools/architecture-batch.part01
          7d933dd735c5f4219402806cf5f27575b761f534 tools/architecture-batch.part02
          3d54a6f9e5e555f607dd36225209b7f33855b58b tools/architecture-batch.part03a
          de812842f9627fb8c5d309dab9372be54cb1d1b4 tools/architecture-batch.part03b
          598de1bec7e6cf85acddf58c676184c7f28713e4 tools/architecture-batch.part03c
          014f35003b39c123310a6c2058bafae0b4726d28 tools/architecture-batch.part03d
          993f553cadcdc7157ad36c9ba0919186f2984358 tools/architecture-batch.part04
          3b4988cc2fc3c9d85e7ca1793de83feffba42db5 tools/architecture-batch.part05a
          83311b9300e6a2f41011c87ee6386f5afcfff6dd tools/architecture-batch.part05b
          8287f0ec7edb9f8fb1dd9b183599f504802ff1b0 tools/architecture-batch.part05c
          6a421eab5246bc7bc7d06eca6e01d68dc6672322 tools/architecture-batch.part05d
          ba08ce5765da8ac3138597de75a7484ef532131f tools/architecture-batch.part06
          6c51c221e77d45cc5724d018418774018d5eccfa tools/architecture-batch.part07
          EOF
          cat \
            tools/architecture-batch.part00 \
            tools/architecture-batch.part01 \
            tools/architecture-batch.part02 \
            tools/architecture-batch.part03a \
            tools/architecture-batch.part03b \
            tools/architecture-batch.part03c \
            tools/architecture-batch.part03d \
            tools/architecture-batch.part04 \
            tools/architecture-batch.part05a \
            tools/architecture-batch.part05b \
            tools/architecture-batch.part05c \
            tools/architecture-batch.part05d \
            tools/architecture-batch.part06 \
            tools/architecture-batch.part07 \
            | base64 --decode > /tmp/architecture-batch.tar.gz
          echo "4af8ec7883c8e2dda60b549f4415464ae70c69f2705cdf9d4e2f25b6ee48e0b5  /tmp/architecture-batch.tar.gz" | sha256sum --check
          tar -xzf /tmp/architecture-batch.tar.gz
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('.architecture-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for raw_path in manifest['delete']:
              path = Path(raw_path)
              if path.exists():
                  path.unlink()
          manifest_path.unlink()
          PY
          rm -f tools/architecture-batch.part*
      - name: Commit atomic Architecture 2.0 implementation
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/ci.yml
          git config user.name "ChatPulse Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "architecture: implement ChatPulse 2.0"
          git push origin HEAD:architecture/chatpulse-2-0

  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload architecture source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: architecture-source-snapshot
          path: |
            .
            !.git
            !miniapp/node_modules
            !miniapp/dist
            !miniapp/playwright-report
            !miniapp/test-results

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        shell: bash
        run: |
          set +e
          npm test -- --run > ../frontend-test.log 2>&1
          status=$?
          tail -n 200 ../frontend-test.log
          exit $status
      - name: Upload frontend test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: frontend-test.log
      - run: npm run typecheck
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - name: Run WebKit mobile checks
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            miniapp/playwright-report
            miniapp/test-results
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -e ".[dev]" -c requirements.lock
      - name: Run backend lint
        shell: bash
        run: |
          set +e
          ruff check . > backend-lint.log 2>&1
          status=$?
          cat backend-lint.log
          exit $status
      - name: Upload backend lint log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-log
          path: backend-lint.log
      - name: Check backend formatting
        shell: bash
        run: |
          set +e
          ruff format --check --diff . > backend-format.log 2>&1
          status=$?
          cat backend-format.log
          exit $status
      - name: Upload backend formatting diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-format-log
          path: backend-format.log
      - name: Run backend tests
        shell: bash
        run: |
          set +e
          pytest -q > backend-test.log 2>&1
          status=$?
          tail -n 300 backend-test.log
          exit $status
      - name: Upload backend test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend-test.log
      - run: python -m compileall app migrations

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, browser, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        shell: bash
        run: |
          set +e
          docker build -t chatpulse-miniapp:test . > docker-build.log 2>&1
          status=$?
          tail -n 240 docker-build.log
          exit $status
      - name: Upload Docker build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: docker-build.log
