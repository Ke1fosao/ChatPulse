name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-stability:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability/chatpulse-1-0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply approved stability changes
        run: python tools/apply_stability_batch.py
      - name: Generate deterministic Node lock
        working-directory: miniapp
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate deterministic Python constraints
        run: |
          python -m venv /tmp/chatpulse-lock
          /tmp/chatpulse-lock/bin/pip install -q .
          /tmp/chatpulse-lock/bin/pip freeze | grep -v '^chatpulse' > requirements.lock
      - name: Commit atomic stability batch
        run: |
          rm -f tools/apply_stability_batch.py .github/workflows/apply-stability.yml
          git config user.name "ChatPulse Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "stability: complete hardening and browser verification"
          git push origin HEAD:stability/chatpulse-1-0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - name: Refresh dependency lock during stability work
        run: npm install --no-audit --no-fund
      - name: Upload refreshed package lock
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-package-lock
          path: miniapp/package-lock.json
      - name: Run frontend tests
        shell: bash
        run: |
          set +e
          npm test -- --run > ../frontend-test.log 2>&1
          status=$?
          tail -n 200 ../frontend-test.log
          exit $status
      - name: Upload frontend test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: frontend-test.log
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stability-source-snapshot
          path: |
            .
            !.git
            !miniapp/node_modules
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -e ".[dev]"
      - name: Run backend lint
        shell: bash
        run: |
          set +e
          ruff check . > backend-lint.log 2>&1
          status=$?
          cat backend-lint.log
          exit $status
      - name: Upload backend lint log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-log
          path: backend-lint.log
      - run: ruff format --check .
      - name: Run backend tests
        shell: bash
        run: |
          set +e
          pytest -q > backend-test.log 2>&1
          status=$?
          tail -n 300 backend-test.log
          exit $status
      - name: Upload backend test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend-test.log
      - run: python -m compileall app migrations

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chatpulse-miniapp:test .
