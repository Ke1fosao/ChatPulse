name: CI

on:
  push:
    branches:
      - production/chatpulse-3-0
  pull_request:

permissions:
  contents: write

jobs:
  apply-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/chatpulse-3-0
          fetch-depth: 0
      - name: Verify and apply Production 3.0 package
        run: |
          set +e
          python tools/apply_production.py > production-apply.log 2>&1
          status=$?
          cat production-apply.log
          exit $status
      - name: Upload applicator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-apply-log
          path: production-apply.log
      - name: Commit clean implementation without workflow mutations
        run: |
          set +e
          {
            set -euo pipefail
            rm -f production-apply.log
            git checkout HEAD -- .github/workflows/ci.yml .github/workflows/apply-production.yml
            rm -f \
              .github/workflows/release-cloud-run.yml \
              .github/workflows/restore-verification.yml \
              .github/workflows/staging-load.yml
            git config user.name "ChatPulse Production Bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "production: implement ChatPulse 3.0 hardening"
            git push origin HEAD:production/chatpulse-3-0
          } > production-commit.log 2>&1
          status=$?
          cat production-commit.log
          exit $status
      - name: Upload commit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-commit-log
          path: production-commit.log
