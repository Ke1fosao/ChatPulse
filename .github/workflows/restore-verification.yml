name: Restore verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    environment: restore-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q . -c requirements.lock
      - name: Verify explicitly restored database
        env:
          ALLOW_RESTORE_VERIFICATION: "1"
          RESTORED_DATABASE_URL: ${{ secrets.RESTORED_DATABASE_URL }}
        run: python -m scripts.verify_restore --database-url "$RESTORED_DATABASE_URL"
