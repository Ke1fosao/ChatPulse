name: Staging load profile

on:
  workflow_dispatch:
    inputs:
      users:
        description: Concurrent users
        default: "20"
        required: true
      duration:
        description: Duration, for example 15m
        default: "15m"
        required: true
      max_p95_ms:
        description: Maximum aggregate p95 milliseconds
        default: "1500"
        required: true

permissions:
  contents: read

jobs:
  load:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -e ".[dev]" -c requirements.lock
      - name: Run staging profile
        env:
          LOAD_BOT_TOKEN: ${{ secrets.LOAD_BOT_TOKEN }}
          LOAD_USER_ID: ${{ secrets.LOAD_USER_ID }}
          LOAD_GROUP_ID: ${{ vars.LOAD_GROUP_ID }}
          LOAD_HOST: ${{ vars.LOAD_HOST }}
          LOAD_WEBHOOK_PATH: ${{ vars.LOAD_WEBHOOK_PATH }}
          LOAD_WEBHOOK_SECRET: ${{ secrets.LOAD_WEBHOOK_SECRET }}
          LOAD_OWNER_SCENARIOS: ${{ vars.LOAD_OWNER_SCENARIOS }}
          LOAD_INVOICE_SCENARIO: ${{ vars.LOAD_INVOICE_SCENARIO }}
        run: |
          locust -f load/locustfile.py --headless \
            --host "$LOAD_HOST" \
            --users "${{ inputs.users }}" \
            --spawn-rate 5 \
            --run-time "${{ inputs.duration }}" \
            --only-summary \
            --csv load-report \
            --html load-report.html \
            --exit-code-on-error 1
      - name: Enforce aggregate p95 and error-rate SLO
        env:
          MAX_P95_MS: ${{ inputs.max_p95_ms }}
        run: |
          python - <<'PY'
          import csv
          import os

          with open('load-report_stats.csv', newline='', encoding='utf-8') as file:
              rows = list(csv.DictReader(file))
          aggregate = next(row for row in rows if row['Name'] == 'Aggregated')
          requests = int(aggregate['Request Count'])
          failures = int(aggregate['Failure Count'])
          p95 = float(aggregate['95%'])
          error_rate = failures / max(1, requests)
          print(f'requests={requests} failures={failures} error_rate={error_rate:.4f} p95_ms={p95}')
          if error_rate >= 0.01:
              raise SystemExit('Load error rate is at or above 1%')
          if p95 > float(os.environ['MAX_P95_MS']):
              raise SystemExit('Aggregate p95 exceeded the configured staging SLO')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-load-report
          path: |
            load-report*.csv
            load-report.html
          if-no-files-found: error
