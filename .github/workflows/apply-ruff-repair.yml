name: Apply Ruff Repair Once

on:
  push:
    branches:
      - production/chatpulse-3-0

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/chatpulse-3-0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q ruff
      - name: Apply safe Ruff fixes and formatting
        run: |
          ruff check app tests --fix || true
          ruff format app tests
      - name: Commit only deterministic Python repairs
        run: |
          set -euo pipefail
          git config user.name "ChatPulse Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply deterministic Ruff repairs"
          git push origin HEAD:production/chatpulse-3-0
